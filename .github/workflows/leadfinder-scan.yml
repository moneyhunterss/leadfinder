name: LeadFinder scan + notify

# ──────────────────────────────────────────────────────────────────────────
# Runs the lead scanner on schedule, sends new leads to Telegram, commits
# state back to the repo for cross-run dedup.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  — from @BotFather
#   TELEGRAM_CHAT_ID    — your chat ID (run /start in the bot, it shows you)
#
# Cron options (edit `cron:` below):
#   every 15 min       : '*/15 * * * *'   (max — GitHub's hard floor)
#   every 30 min       : '*/30 * * * *'
#   every hour         : '0 * * * *'      (default)
#   every 6 hours       : '0 */6 * * *'
#   daily 9am UTC      : '0 9 * * *'
#
# Free tier: 2000 min/month. Each run uses ~2 min, so hourly = ~24 min/mo.
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 * * * *'   # hourly — change to taste
  workflow_dispatch:      # allow manual runs from Actions tab

permissions:
  contents: write         # needed to commit leads.json back to repo

concurrency:
  group: leadfinder-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: leadfinder/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r leadfinder/requirements.txt

      - name: Save previous state for diffing
        run: |
          mkdir -p leadfinder/data
          if [ -f leadfinder/data/leads.json ]; then
            cp leadfinder/data/leads.json leadfinder/data/leads_prev.json
          else
            echo '[]' > leadfinder/data/leads_prev.json
          fi

      - name: Run scan (direct RSS + HN + Bitcointalk, strict gates)
        working-directory: leadfinder
        run: |
          python scan_v2.py

      - name: Telegram notify (new leads only)
        working-directory: leadfinder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify_telegram.py \
            --prev-state data/leads_prev.json \
            --curr-state data/leads.json \
            --min-score 40 \
            --max-messages 20 || true

      - name: Discord notify (new leads only)
        working-directory: leadfinder
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            python discord_notify.py \
              --prev-state data/leads_prev.json \
              --curr-state data/leads.json \
              --min-score 40 \
              --max-messages 20 || true
          else
            echo "DISCORD_WEBHOOK_URL not set — skipping Discord notify."
          fi

      - name: Commit updated state + digest
        run: |
          git config user.name  "leadfinder-bot"
          git config user.email "leadfinder-bot@users.noreply.github.com"
          git add leadfinder/data/leads.json download/leads_digest.md download/leads.csv download/leads.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "leadfinder: scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
