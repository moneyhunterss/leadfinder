name: Scan + Notify
"on":
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      LEADFINDER_PAT: ${{ secrets.LEADFINDER_PAT }}
    steps:
      - name: Checkout leadfinder
        uses: actions/checkout@v4
        with:
          repository: moneyhunterss/leadfinder
          token: ${{ secrets.LEADFINDER_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests PyYAML
      - name: Scan + Notify
        run: python scan.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "scan $(date -u)" && git push https://x-access-token:${LEADFINDER_PAT}@github.com/moneyhunterss/leadfinder.git HEAD:main || true)
